services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: efl_user
      POSTGRES_PASSWORD: efl_password
      POSTGRES_DB: efl_db
    ports:
      - "5432:5432"
    volumes:
      - efl_postgres_data:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/code

volumes:
  efl_postgres_data:
